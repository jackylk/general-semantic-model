[project]
name = "general-semantic-model"
version = "0.1.0"
description = "Evidence-grounded, domain-defined knowledge prototype"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "mcp>=1.20,<2",
    "tokenizers==0.23.3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
environments = ["sys_platform == 'darwin'"]
