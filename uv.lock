version = 1
revision = 3
requires-python = ">=3.12"
resolution-markers = [
    "sys_platform == 'darwin'",
]
supported-markers = [
    "sys_platform == 'darwin'",
]

[[package]]
name = "annotated-types"
version = "0.7.0"
source = { registry = "runtime/wheels" }
wheels = [
    { path = "annotated_types-0.7.0-py3-none-any.whl" },
]

[[package]]
name = "general-semantic-model"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "pydantic" },
    { name = "pyyaml" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "pydantic", specifier = ">=2.10,<3" },
    { name = "pyyaml", specifier = ">=6,<7" },
]

[package.metadata.requires-dev]
dev = [{ name = "pytest", specifier = ">=8,<10" }]

